<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cricket Championship</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div>
      <div class="eyebrow">TOURNAMENT CONTROL CENTER</div>
      <h1>World Cricket Championship</h1>
      <p>Live Bracket &amp; Scoreboard</p>
    </div>
    <div class="live"><span></span> LIVE</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-page="dashboard">Dashboard</button>
    <button class="tab" data-page="teams">Teams &amp; Players</button>
    <button class="tab" data-page="matches">Matches</button>
    <button class="tab" data-page="bracket">Bracket</button>
    <button class="tab" data-page="streamer">Streamer</button>
  </nav>

  <main>
    <section id="dashboard" class="page active">
      <h2>Live Match</h2>
      <div id="liveMatch" class="live-card"></div>

      <h2>Teams</h2>
      <div id="teamGrid" class="team-grid"></div>
    </section>

    <section id="teams" class="page">
      <div class="section-head">
        <div>
          <h2>Teams &amp; Players</h2>
          <p>Add teams, players, photos and individual scores.</p>
        </div>
        <button id="addTeamBtn" class="primary">+ Add Team</button>
      </div>
      <div id="teamManager" class="team-manager"></div>
    </section>

    <section id="matches" class="page">
      <div class="section-head">
        <div>
          <h2>Matches</h2>
          <p>Update the live match score.</p>
        </div>
      </div>
      <div id="matchList"></div>
    </section>

    <section id="bracket" class="page">
      <h2>Tournament Bracket</h2>
      <div id="bracketView" class="bracket"></div>
    </section>

    <section id="streamer" class="page">
      <h2>Streamer View</h2>
      <div id="streamerView" class="streamer-card"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="close">&times;</button>
      <h2 id="modalTitle">Add Team</h2>
      <form id="teamForm">
        <label>Team name
          <input id="teamName" required placeholder="Example: India">
        </label>
        <label>Flag / Emoji
          <input id="teamFlag" placeholder="🇮🇳">
        </label>
        <button class="primary" type="submit">Save Team</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
